[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-market-data-cleaning-pipeline"
version = "0.2.0"
description = "Immutable-source quality control for IBKR SOXX and NQ Globex 1-minute data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<24",
  "pandas-market-calendars>=4.4,<6",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
colab = ["google-api-python-client>=2.120,<3", "google-auth>=2.28,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
ibkr-soxx-qc = "ibkr_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
